[package]
name = "memi-web"
version = "0.6.3"
edition = "2021"
description = "Memi in the browser (memi.yourmemi.app): the same data, merge and encryption as the apps."
license = "MIT"
publish = false

[dependencies]
# Shared with the desktop app: model, dates, backup format, merge, encryption, pairing, palettes.
memi-core = { path = "../core" }
memi-engine = { path = "../engine" }

# UI: Leptos, client-side rendering only (a static site; no server).
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement",
    "Blob", "BlobPropertyBag", "Url", "File", "FileList", "Event", "KeyboardEvent", "MouseEvent",
    "DragEvent", "DataTransfer", "MediaQueryList", "Storage", "Location", "Navigator",
    "CssStyleDeclaration", "DomRect", "VisibilityState", "Headers", "Request", "RequestInit",
    "Response", "Clipboard", "HtmlAnchorElement",
] }
gloo-timers = { version = "0.4", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
anyhow = "1"

[profile.release]
# Small and quick to load.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
