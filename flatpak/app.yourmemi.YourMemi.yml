# Flatpak manifest for Your Memi (the desktop app in ../desktop).
#
# The same file is submitted to Flathub. CI (.github/workflows/build.yml) builds it from the
# checked-out code and runs Flathub's linter on it. On each release it pins the tag and commit,
# regenerates cargo-sources.json, and opens a pull request on the Flathub repository. (There's no
# x-checker-data: Flathub's bot can't regenerate the Rust dependency list, so it would open
# update requests that don't build.)
#
# Permissions, and why:
#   network:  only for the optional, end-to-end encrypted sync to your own Google Drive
#             (and Google sign-in on 127.0.0.1). Nothing is sent anywhere unless you turn it on.
#   org.freedesktop.secrets: keeps the sync key and Google sign-in in your desktop's keyring
#             rather than in a plain file. Without it, they're kept in the app's own folder.
#   Photos are picked through the desktop's file chooser portal; no home folder access.
id: app.yourmemi.YourMemi
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: your-memi
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.secrets
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/your-memi/cargo
    CARGO_NET_OFFLINE: 'true'
    # Keeps the build small enough for CI and Flathub's builders.
    CARGO_PROFILE_RELEASE_DEBUG: '0'
    CARGO_INCREMENTAL: '0'
modules:
  - name: your-memi
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path desktop/Cargo.toml --verbose
      - cargo --offline build --release --manifest-path desktop/Cargo.toml
      - install -Dm755 desktop/target/release/your-memi /app/bin/your-memi
      - install -Dm644 desktop/packaging/app.yourmemi.YourMemi.desktop /app/share/applications/app.yourmemi.YourMemi.desktop
      - install -Dm644 desktop/packaging/app.yourmemi.YourMemi.metainfo.xml /app/share/metainfo/app.yourmemi.YourMemi.metainfo.xml
      - install -Dm644 desktop/packaging/icons/app.yourmemi.YourMemi.svg /app/share/icons/hicolor/scalable/apps/app.yourmemi.YourMemi.svg
      - for s in 64 128 256 512; do install -Dm644 desktop/packaging/icons/$s.png /app/share/icons/hicolor/${s}x${s}/apps/app.yourmemi.YourMemi.png; done
    sources:
      - type: git
        url: https://github.com/alex-ha-192/memi.git
        tag: v0.5.0
      - cargo-sources.json
