[package]
name = "your-memi"
version = "0.6.0"
edition = "2021"
description = "Remember the little things about the people in your life"
license = "GPL-3.0-or-later"
repository = "https://github.com/alex-ha-192/memi"
publish = false

[[bin]]
name = "your-memi"
path = "src/main.rs"

[dependencies]
# Shared with the web app: model, dates, backup format, merge, encryption, pairing.
memi-core = { path = "../core" }
# Everything below the screens: data, edits, storage (SQLite), Google Drive and sync.
memi-engine = { path = "../engine", features = ["sqlite", "native-drive"] }

# UI: GPUI (the snapshot gpui-component is built against) and its component library for text fields.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["x11", "wayland"] }
gpui-component = "=0.10.0"

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "5"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"

# Birthday reminders while the app is open (D-Bus on Linux, toast notifications on Windows).
notify-rust = "4"

# Photos
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

# Sync: HTTPS with rustls only (encryption and pairing are in memi-core), no telemetry anywhere.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
tiny_http = "0.12"
# OAuth 2 with PKCE for Google sign-in (state, token exchange, refresh, revocation).
oauth2 = { version = "5", default-features = false, features = ["ureq"] }
url = "2"
webbrowser = "1"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
keyring = { version = "3", features = ["windows-native", "async-secret-service", "async-io", "crypto-rust"] }
zeroize = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
