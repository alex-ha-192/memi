# Builds the web app (web/, Rust + Leptos compiled to WebAssembly) on every push that touches it,
# and publishes it to Cloudflare Pages (memi.yourmemi.app) from main.
#
# Needs:
# - Repository variable MEMI_WEB_CLIENT_ID: the Google OAuth "Web application" client ID, from
#   the same Google Cloud project as the Android and desktop clients. Without it, the web app
#   works but Sync is off.
# - The CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets the website already uses.
# The client secret is never needed: browser sign-in only uses the client ID.
name: Web app

on:
  push:
    branches: [main]
    paths: ["web/**", "core/**", "website/fonts/**", "website/img/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "core/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A repository variable or a secret: either works (the client ID isn't private).
      MEMI_WEB_CLIENT_ID: ${{ vars.MEMI_WEB_CLIENT_ID || secrets.MEMI_WEB_CLIENT_ID }}
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web
      - name: Tests
        working-directory: web
        run: cargo test --release
      - name: Install Trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv trunk /usr/local/bin/
      - name: Build
        working-directory: web
        run: |
          if [ -z "$MEMI_WEB_CLIENT_ID" ]; then echo "::warning::No MEMI_WEB_CLIENT_ID variable, so Sync is off in this build. See docs/RELEASING.md."; fi
          trunk build --release
          # The site's security policy allows no inline scripts, so Trunk's start-up script
          # moves to its own file.
          python3 scripts/externalise_boot.py dist
          ls -la dist
      - name: Check the page starts under the real security policy
        working-directory: web
        run: |
          python3 scripts/serve_with_headers.py dist 8790 &
          sleep 1
          for i in 1 2 3; do
            google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom http://localhost:8790/ > dom.html 2>/dev/null || true
            grep -q 'style="--bg:' dom.html && break
            sleep 2
          done
          # The app's first act is setting the theme's colours on <html>; a blocked script never gets there.
          grep -q 'style="--bg:' dom.html || { echo "::error::The web app didn't start (blank page). Check the Content-Security-Policy in public/_headers."; head -c 3000 dom.html; exit 1; }
          echo "The web app starts."
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/dist
      - name: Keep the build on the ci-web branch (for checking it without Cloudflare)
        if: github.ref == 'refs/heads/main'
        run: |
          cd web/dist
          git init -q -b ci-web
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Web build for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-web
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true' && github.ref == 'refs/heads/main'
        with:
          node-version: 22
      - name: Deploy to Cloudflare Pages
        if: env.HAS_TOKEN == 'true' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The first run creates the Pages project; later runs just deploy.
          npx --yes wrangler@4 pages project create memi-web --production-branch=main || true
          npx --yes wrangler@4 pages deploy web/dist --project-name=memi-web --branch=main
