# Publishes website/ to Cloudflare Pages (yourmemi.app) whenever it changes on main.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (permission: Account > Cloudflare Pages > Edit)
# and CLOUDFLARE_ACCOUNT_ID. Until they exist, this workflow skips the deploy.
name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
      - name: Deploy to Cloudflare Pages
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The first run creates the Pages project; later runs just deploy.
          npx --yes wrangler@4 pages project create yourmemi --production-branch=main || true
          npx --yes wrangler@4 pages deploy website --project-name=yourmemi --branch=main
      - name: Not deployed
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy the website."
