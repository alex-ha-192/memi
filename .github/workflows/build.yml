# Builds Your Memi everywhere on every push to main:
#   Android APK, Android screenshots (emulator), Linux binary + AppImage, Windows .msi
#   .exe, and the Flatpak.
# Pushing a tag like v0.5.0 also:
#   - publishes a GitHub Release with every download (Obtainium watches these for the APK)
#   - opens a pull request on the Flathub repository with the new version (needs FLATHUB_TOKEN)
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - id: v
        run: |
          # Releases use the tag. Everything else gets 0.0.<run> so test installers still
          # upgrade each other but never replace a real release.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/memi.keystore"
            echo "MEMI_KEYSTORE=$RUNNER_TEMP/memi.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so this APK is signed with a throwaway key. It won't update an installed Your Memi, and Google sign-in won't work. See README > Continuous builds and releases > Secrets."
          fi
      - name: Build
        env:
          MEMI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEMI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEMI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE: ${{ needs.version.outputs.release }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ARGS=""
          if [ "$RELEASE" = "true" ]; then ARGS="-PmemiVersion=$VERSION"; fi
          ./gradlew :app:assembleRelease $ARGS --stacktrace
      - name: Name the APK and show its signing fingerprint
        run: |
          V=$(python3 -c "import json;print(json.load(open('app/build/outputs/apk/release/output-metadata.json'))['elements'][0]['versionName'])")
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/YourMemi-$V.apk"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          echo "Permissions in the final app (the privacy policy lists these):"
          "$AAPT" dump permissions "out/YourMemi-$V.apk"
          echo "Content providers that start with the app:"
          "$AAPT" dump xmltree --file AndroidManifest.xml "out/YourMemi-$V.apk" | grep -A3 "E: provider" | grep -E "android:name" || true
          echo "Signing certificate (the SHA-1 goes in Google Cloud's Android client):"
          "$APKSIGNER" verify --print-certs "out/YourMemi-$V.apk" | grep -E "SHA-1|SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  android-screens:
    name: Android screenshots
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/android/sdk/ndk
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build the app and the tour
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 3072M
          disable-animations: false
          script: bash .github/scripts/screen-tour.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screens
          path: shots/
      - name: Also publish to the ci-screens branch (dev builds only)
        if: always() && github.ref == 'refs/heads/main'
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b ci-screens
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screens for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screens

  linux:
    name: Linux (binary, AppImage)
    needs: version
    # Built on the oldest supported Ubuntu so the binary runs on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev libxcb1-dev libx11-xcb-dev
      - name: Tests
        working-directory: desktop
        run: cargo test --release
      - name: Build
        working-directory: desktop
        run: cargo build --release
      - name: AppImage
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          D=AppDir
          install -Dm755 desktop/target/release/your-memi $D/usr/bin/your-memi
          install -Dm644 desktop/packaging/app.yourmemi.YourMemi.desktop $D/usr/share/applications/app.yourmemi.YourMemi.desktop
          install -Dm644 desktop/packaging/app.yourmemi.YourMemi.metainfo.xml $D/usr/share/metainfo/app.yourmemi.YourMemi.appdata.xml
          install -Dm644 desktop/packaging/icons/256.png $D/usr/share/icons/hicolor/256x256/apps/app.yourmemi.YourMemi.png
          cp desktop/packaging/app.yourmemi.YourMemi.desktop desktop/packaging/icons/256.png $D/
          mv $D/256.png $D/app.yourmemi.YourMemi.png
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/your-memi" "$@"\n' > $D/AppRun
          chmod +x $D/AppRun
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mkdir -p out
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run $D "out/YourMemi-$VERSION-x86_64.AppImage"
          cp desktop/target/release/your-memi "out/your-memi-$VERSION-linux-x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  windows:
    name: Windows (.msi)
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Tests
        working-directory: desktop
        run: cargo test --release
      - name: Build
        working-directory: desktop
        run: cargo build --release
      - name: Installer
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet tool install --global wix --version 5.0.2
          mkdir -p out
          wix build desktop/packaging/main.wxs -arch x64 \
            -d Version="$VERSION" -d Exe="desktop/target/release/your-memi.exe" -d Assets="desktop/assets" \
            -o "out/YourMemi-$VERSION.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  cargo-sources:
    name: Flatpak crate sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate cargo-sources.json
        run: |
          pip install --quiet aiohttp tomlkit
          curl -sSL -o "$RUNNER_TEMP/flatpak-cargo-generator.py" https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 "$RUNNER_TEMP/flatpak-cargo-generator.py" desktop/Cargo.lock -o flatpak/cargo-sources.json
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-sources
          path: flatpak/cargo-sources.json

  flatpak:
    name: Flatpak
    needs: [version, cargo-sources]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      # The runner's preinstalled SDKs are mounted so they can be removed: the Rust build needs the space.
      options: --privileged -v /usr/share/dotnet:/host/dotnet -v /usr/local/lib/android:/host/android -v /opt/hostedtoolcache:/host/toolcache
    steps:
      - name: Free disk space
        run: |
          rm -rf /host/dotnet/* /host/android/* /host/toolcache/* || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-sources
          path: flatpak
      - name: Build from this checkout
        run: |
          # The Flathub manifest builds from a release tag; here, build the code as checked out.
          python3 - <<'PY'
          import re
          p = "flatpak/app.yourmemi.YourMemi.yml"
          s = open(p).read()
          s = re.sub(r"      - type: git\n(        .*\n)+?(?=      - cargo-sources.json)", "      - type: dir\n        path: ..\n", s)
          open(p, "w").write(s)
          PY
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: YourMemi-${{ needs.version.outputs.version }}.flatpak
          manifest-path: flatpak/app.yourmemi.YourMemi.yml
          cache-key: flatpak-${{ hashFiles('desktop/Cargo.lock') }}
          upload-artifact: true

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, android, linux, windows, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        run: |
          cd files
          rm -f cargo-sources.json
          sha256sum * > SHA256SUMS.txt
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true

  flathub:
    name: Update Flathub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, release, cargo-sources]
    runs-on: ubuntu-latest
    steps:
      - name: Needs a token
        id: token
        env:
          TOKEN: ${{ secrets.FLATHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::notice::No FLATHUB_TOKEN secret, so Flathub wasn't updated. See README > Flathub."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.skip != 'true'
      - uses: actions/download-artifact@v4
        if: steps.token.outputs.skip != 'true'
        with:
          name: cargo-sources
          path: new
      - name: Open a pull request on Flathub
        if: steps.token.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          git clone "https://x-access-token:${GH_TOKEN}@github.com/flathub/app.yourmemi.YourMemi.git" flathub
          cd flathub
          git checkout -b "update-$VERSION"
          cp ../flatpak/app.yourmemi.YourMemi.yml app.yourmemi.YourMemi.yml
          sed -i "s|        tag: v.*|        tag: v$VERSION\n        commit: $COMMIT|" app.yourmemi.YourMemi.yml
          cp ../new/cargo-sources.json cargo-sources.json
          git add -A
          git -c user.name="Your Memi release bot" -c user.email="noreply@yourmemi.app" commit -m "Update to $VERSION"
          git push origin "update-$VERSION"
          gh pr create --repo flathub/app.yourmemi.YourMemi --head "update-$VERSION" --title "Update to $VERSION" --body "Automated update from the Your Memi release."
