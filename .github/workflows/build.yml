# Builds Your Memi everywhere on every push to main:
#   Android APK, Android screenshots (emulator), Linux binary + AppImage, Windows .msi.
# Pushing a tag like v0.5.0 also publishes a GitHub Release with every download
# (Obtainium watches these for the APK; AppImage updaters use the .zsync file).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - id: v
        run: |
          # Releases use the tag. Everything else gets 0.0.<run> so test installers still
          # upgrade each other but never replace a real release.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/memi.keystore"
            echo "MEMI_KEYSTORE=$RUNNER_TEMP/memi.keystore" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A release signed with a throwaway key would fail to update every installed copy (Obtainium included).
            echo "::error::Releases need the ANDROID_KEYSTORE_BASE64 secret."; exit 1
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so this APK is signed with a throwaway key. It won't update an installed Memi, and Google sign-in won't work. See docs/RELEASING.md."
          fi
      - name: Build
        env:
          MEMI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEMI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEMI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE: ${{ needs.version.outputs.release }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ARGS=""
          if [ "$RELEASE" = "true" ]; then ARGS="-PmemiVersion=$VERSION"; fi
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease $ARGS --stacktrace
      - name: Name the APK and show its signing fingerprint
        run: |
          V=$(python3 -c "import json;print(json.load(open('app/build/outputs/apk/release/output-metadata.json'))['elements'][0]['versionName'])")
          mkdir -p out
          # A fixed name, so releases/latest/download/YourMemi.apk always points at the newest.
          cp app/build/outputs/apk/release/app-release.apk out/YourMemi.apk
          echo "Version $V"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          echo "Permissions in the final app (the privacy policy lists these):"
          "$AAPT" dump permissions out/YourMemi.apk
          echo "Content providers that start with the app:"
          "$AAPT" dump xmltree --file AndroidManifest.xml out/YourMemi.apk | grep -A3 "E: provider" | grep -E "android:name" || true
          echo "Signing certificate (the SHA-1 goes in Google Cloud's Android client):"
          "$APKSIGNER" verify --print-certs out/YourMemi.apk | grep -E "SHA-1|SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  android-screens:
    name: Android screenshots
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/android/sdk/ndk
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build the app and the tour
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 3072M
          disable-animations: false
          script: bash .github/scripts/screen-tour.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screens
          path: shots/
      - name: Also publish to the ci-screens branch (dev builds only)
        if: always() && github.ref == 'refs/heads/main'
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b ci-screens
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screens for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screens

  linux:
    name: Linux (binary, AppImage)
    needs: version
    # Built on the oldest supported Ubuntu so the binary runs on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop
            core
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev libxcb1-dev libx11-xcb-dev
      - name: Tests (shared core)
        working-directory: core
        run: cargo test --release
      - name: Tests
        working-directory: desktop
        run: cargo test --release
      - name: Build
        working-directory: desktop
        run: cargo build --release
      - name: AppImage
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          D=AppDir
          install -Dm755 desktop/target/release/your-memi $D/usr/bin/your-memi
          install -Dm644 desktop/packaging/app.yourmemi.YourMemi.desktop $D/usr/share/applications/app.yourmemi.YourMemi.desktop
          install -Dm644 desktop/packaging/app.yourmemi.YourMemi.metainfo.xml $D/usr/share/metainfo/app.yourmemi.YourMemi.appdata.xml
          install -Dm644 desktop/packaging/icons/256.png $D/usr/share/icons/hicolor/256x256/apps/app.yourmemi.YourMemi.png
          cp desktop/packaging/app.yourmemi.YourMemi.desktop desktop/packaging/icons/256.png $D/
          mv $D/256.png $D/app.yourmemi.YourMemi.png
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/your-memi" "$@"\n' > $D/AppRun
          chmod +x $D/AppRun
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mkdir -p out
          # The update info lets AppImage updaters (Gear Lever, AppImageUpdate) fetch new releases
          # from GitHub; appimagetool also writes the .zsync file they download first.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            -u "gh-releases-zsync|alex-ha-192|memi|latest|YourMemi-x86_64.AppImage.zsync" \
            $D out/YourMemi-x86_64.AppImage
          mv -f ./*.AppImage.zsync out/ 2>/dev/null || true
          ls -la out
          cp desktop/target/release/your-memi "out/your-memi-$VERSION-linux-x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  windows:
    name: Windows (.msi)
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Tests
        working-directory: desktop
        run: cargo test --release
      - name: Build
        working-directory: desktop
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The .exe carries the same version as the installer.
          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml
          cargo build --release
      - name: Installer
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet tool install --global wix --version 5.0.2
          mkdir -p out
          wix build desktop/packaging/main.wxs -arch x64 \
            -d Version="$VERSION" -d Exe="desktop/target/release/your-memi.exe" -d Assets="desktop/assets" \
            -o out/YourMemi.msi

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, android, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Release files and notes
        run: |
          # Only what people download: the APK, the Windows installer, the AppImage, and the
          # AppImage's .zsync file (AppImage updaters need it to fetch new versions).
          mkdir -p release
          cp files/YourMemi.apk files/YourMemi.msi files/YourMemi-x86_64.AppImage files/YourMemi-x86_64.AppImage.zsync release/
          ls -la release
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs release/YourMemi.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}' | sed 's/../&:/g; s/:$//' | tr a-f A-F)
          {
            echo "### Android"
            echo "Package \`app.memi\`, signing certificate SHA-256:"
            echo '```'
            echo "$CERT"
            echo '```'
            echo "Add to [Obtainium](https://obtainium.imranr.dev) with this repository's URL for automatic updates."
            echo
            echo "### Linux"
            echo "The AppImage can update itself with an AppImage updater such as Gear Lever or AppImageUpdate."
            echo
            echo "### Windows"
            echo "The installer isn't code-signed: if Windows says it protected your PC, choose More info, then Run anyway."
            echo
            echo "### Checksums (SHA-256)"
            echo '```'
            (cd release && sha256sum YourMemi.apk YourMemi.msi YourMemi-x86_64.AppImage)
            echo '```'
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: notes.md
          generate_release_notes: true
